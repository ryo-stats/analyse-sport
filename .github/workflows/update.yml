name: Mise à jour des analyses

on:
  schedule:
    # toutes les 10 minutes, à des minutes creuses (GitHub retarde ou saute des lancements aux heures pleines :
    # le 26/10, rien entre 0 h 21 et 12 h 16). horaires.py garde les 7 passages prévus (heure de Paris : 7 h 20,
    # 12 h 20, 14 h 20, 16 h 20, 17 h 50, 20 h 20, 23 h 50, rattrapés au lancement suivant s'ils sont sautés) et,
    # en plus, un recalcul toutes les 20 min de 75 à 5 min avant un coup d'envoi (compositions officielles).
    # Les autres lancements s'arrêtent en quelques secondes.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:         # bouton « Run workflow » (toujours exécuté) ; le robot Cloudflare l'utilise en secours
    inputs:
      porte:
        description: "toujours = recalcul forcé ; horaires = seulement si un passage est dû (relance du robot)"
        default: toujours
  push:                      # changement du calcul : nouvelles analyses tout de suite (les commits du robot
    branches: [main]         # ne touchent que docs/ et cache/ : pas de boucle)
    paths: [app.py, horaires.py, requirements.txt, .github/workflows/update.yml]

permissions:
  contents: write

concurrency:
  group: analyses
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Faut-il lancer ?
        id: gate
        env:
          PASSAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.porte == 'horaires' && 'schedule' || github.event_name }}
        run: python3 horaires.py

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Vérifier les calculs
        if: steps.gate.outputs.run == 'true'
        run: python -m unittest discover -s tests

      - name: Calculer les analyses du jour
        if: steps.gate.outputs.run == 'true'
        run: python app.py

      - name: Publier
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "analyse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs cache
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Analyses du $(date -u +%Y-%m-%d) $(date -u +%H:%M) UTC"
          # envoi tolérant : si quelqu'un a publié entre-temps, on se remet à jour et on réessaie (3 fois) ;
          # en cas de conflit sur les fichiers d'analyses, les plus récentes (celles de ce passage) gagnent
          for i in 1 2 3; do
            git pull --rebase -q -X theirs && git push && exit 0
            echo "Envoi refusé (essai $i), nouvel essai dans 10 s"; sleep 10
          done
          exit 1
